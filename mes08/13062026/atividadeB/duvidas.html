<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ásia Central (Continente Asiático) - Dúvidas</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/stylesheet.css">
</head>

<body>
    <header>
        <h2 class="logoName">Países da Ásia Central</h2>
        <nav>
            <ul>
                <li><a href="#" target="_self" rel="noopener noreferrer">home</a></li>
                <li><a href="idiomas.html" target="_self" rel="noopener noreferrer">idiomas</a></li>
                <li><a href="bandeiras.html" target="_self" rel="noopener noreferrer">bandeiras</a></li>
                <li><a href="duvidas.html" target="_self" rel="noopener noreferrer">Dúvidas</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <h1>Alguma dúvida sobre os países da Ásia Central do continente Asiático?</h1>

        <form action="" method="post">
            <label for="firstName">Primeiro Nome</label>
            <input type="text" name="firstName" id="firstName" placeholder="Primeiro Nome">
            <label for="lastName">Sobrenome</label>
            <input type="text" name="lastName" id="lastName" placeholder="Sobrenome">

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="email@example.com">

            <label for="password">Senha</label>
            <input type="password" name="password" id="password" placeholder="senha">

            <p>Gênero</p>
            <input type="radio" name="gender_choice" id="masculino" value="Masculino">
            <label for="Masculino">Masculino</label>
            <input type="radio" name="gender_choice" id="feminino" value="feminino">
            <label for="feminino">Feminino</label>
            <input type="radio" name="gender_choice" id="genderNull" value="prefiro não dizer">
            <label for="genderNull">Prefiro não dizer</label>

            <p>Cidade</p>
            <input type="checkbox" name="saoPaulo" id="saoPaulo" value="São Paulo">
            <label for="saoPaulo">São Paulo</label>

            <input type="checkbox" name="rioDeJaneiro" id="rioDeJaneiro" value="Rio de Janeiro">
            <label for="rioDeJaneiro">Rio de Janeiro</label>

            <input type="checkbox" name="espiritoSanto" id="espiritoSanto" value="Espirito Santo">
            <label for="espiritoSanto">Espirito Santo</label>

            <input type="checkbox" name="minasGerais" id="minasGerais" value="Minas Gerais">
            <label for="minasGerais">Minas Gerais</label>

            <textarea name="doubt" id="doubt" placeholder="Escreva sua dúvida." cols="80" rows="5"></textarea>
            <button type="submit">Enviar</button>

        </form>




    </main>
    <footer>

        <p>Todos os direitos reservados - <strong>Gabriel Guembla</strong></p>
    </footer>

    <section class="doubtSection">
        <button class="doubtMarker">?</button>
    </section>
</body>

</html>
